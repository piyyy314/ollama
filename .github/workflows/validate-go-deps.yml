name: Validate Ollama Go dependency update
on:
  push:
    branches:
      - fix/ui-package-lock-sync
    paths:
      - .github/workflows/validate-go-deps.yml
      - go.mod
      - go.sum
permissions:
  contents: read
jobs:
  go-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Go packages
        run: go test ./...
      - name: Vet Go packages
        run: go vet ./...
