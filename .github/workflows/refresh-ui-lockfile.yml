name: Refresh Ollama UI lockfile
on:
  push:
    branches:
      - fix/ui-package-lock-sync
    paths:
      - .github/workflows/refresh-ui-lockfile.yml
      - app/ui/app/package.json
permissions:
  contents: write
jobs:
  refresh-ui-lockfile:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh, install, build and test UI
        working-directory: app/ui/app
        run: |
          npm install --global npm@latest
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test -- --run
      - name: Commit generated lockfile to this repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui/app/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already synchronized."
          else
            git commit -m "chore(ui): synchronize npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
